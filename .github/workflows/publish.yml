name: Publish Packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@vietvho'
          cache: 'npm'

      - run: npm ci

      - run: npm run build -w @vietvho/lumea-types

      - name: Publish types
        if: github.event_name == 'push'
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view $PACKAGE_NAME@$PACKAGE_VERSION version 2>/dev/null || echo "")
          
          if [ "$PUBLISHED_VERSION" == "$PACKAGE_VERSION" ]; then
            echo "Version $PACKAGE_VERSION of $PACKAGE_NAME is already published. Skipping."
          else
            echo "Publishing $PACKAGE_NAME@$PACKAGE_VERSION..."
            npm publish
          fi
        working-directory: ./types
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npm run build -w @vietvho/lumea-db
      - name: Publish DB
        if: github.event_name == 'push'
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view $PACKAGE_NAME@$PACKAGE_VERSION version 2>/dev/null || echo "")
          
          if [ "$PUBLISHED_VERSION" == "$PACKAGE_VERSION" ]; then
            echo "Version $PACKAGE_VERSION of $PACKAGE_NAME is already published. Skipping."
          else
            echo "Publishing $PACKAGE_NAME@$PACKAGE_VERSION..."
            npm publish
          fi
        working-directory: ./db
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}